name = "readpaper-api"
main = "workers/readpaper-api.js"
compatibility_date = "2026-05-22"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://zcai0612.github.io,http://127.0.0.1:8000,http://localhost:8000"
TOKEN_TTL_SECONDS = "604800"

[secrets]
required = ["READPAPER_PASSWORD_HASH", "READPAPER_AUTH_SECRET"]

[[d1_databases]]
binding = "DB"
database_name = "readpaper-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "workers/migrations"
